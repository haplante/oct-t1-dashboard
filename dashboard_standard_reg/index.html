"use strict";

/* ============================================================================
   SIZING — match the notebook figsizes (inches) and font sizes (points)
   ========================================================================== */
const PXIN = 96;                 // px per inch
const PT   = 96 / 72;            // px per point  (matplotlib points -> px)
const px  = inches => Math.round(inches * PXIN);
const pt  = points => points * PT;

// ---- left-column height budget ----
// right column = fig2 panel + gap + fig3 panel; the left column (fig1 + gap +
// averages box) must sum to the same so the two columns end at the same line.
const PANEL_PAD = 20;                                      // .figpanel top+bottom padding
const COL_GAP   = 16;                                      // grid / flex gap (== CSS --pad)
const FIG23_H   = px(4.25);                                 // shared height: Fig 2 == Fig 3
const RIGHT_COL = (FIG23_H+PANEL_PAD) + COL_GAP + (FIG23_H+PANEL_PAD);
const AVGBOX_H  = 200;                                     // averages box content height
const FIG1_H    = RIGHT_COL - COL_GAP - (AVGBOX_H+PANEL_PAD) - PANEL_PAD;  // fig1 plot height

// Plotly config: in-figure zoom OFF. Keep only a "save" icon (top-right) exporting
// PNG at 600 DPI at the figure's native size. onClick (optional) overrides the
// default single-figure save — used by Fig 2 to export both panels as one image.
function figCfg(divId, filename, natW, natH, onClick){
  return {
    scrollZoom:false, displaylogo:false, displayModeBar:"hover", responsive:false,
    modeBarButtonsToRemove:["toImage","select2d","lasso2d","zoom2d","pan2d",
      "zoomIn2d","zoomOut2d","autoScale2d","resetScale2d"],
    modeBarButtonsToAdd:[{
      name:"save600", title:"Download PNG @ 600 DPI", icon:Plotly.Icons.camera,
      click: onClick || (gd => Plotly.downloadImage(gd, {format:"png", filename:filename,
        width:natW, height:natH, scale:600/96}))
    }]
  };
}

// Export Fig 2 as ONE image: the two panels drawn side by side on a canvas.
function saveFig2Combined(){
  const scale = 600/96, w = px(4.25), h = FIG23_H;
  Promise.all([
    Plotly.toImage("fig2a", {format:"png", width:w, height:h, scale}),
    Plotly.toImage("fig2b", {format:"png", width:w, height:h, scale})
  ]).then(([ua,ub]) => {
    const cw = 2*w*scale, ch = h*scale;
    const canvas = document.createElement("canvas");
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cw,ch);
    const ia = new Image(), ib = new Image();
    let done = 0;
    const finish = () => {
      if (++done < 2) return;
      ctx.drawImage(ia, 0, 0);
      ctx.drawImage(ib, w*scale, 0);
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "fig02_regression.png";
      a.click();
    };
    ia.onload = finish; ib.onload = finish;
    ia.src = ua; ib.src = ub;
  });
}





/* ============================================================================

//const C_OS = "rgb(49,130,189)";  // left  eye  blue

const C_OS = "rgb(59,130,246)";   // #3B82F6 blue (left eye)

// ---- T1 bands (Figure 2) ----
/*const T1_BANDS = [
  ["T1_mean_015", "0–15 mm",  "rgb(51,51,51)"],     // dark grey
  ["T1_mean_05",  "0–5 mm",   "rgb(49,130,189)"],   // blue
  ["T1_mean_510", "5–10 mm",  "rgb(49,163,84)"],    // green
  ["T1_mean_1015","10–15 mm", "rgb(117,107,177)"],  // purple
];*/

const T1_BANDS = [
  ["T1_mean_015", "0–15 mm",  "#2B2D42"], // charcoal
  ["T1_mean_05",  "0–5 mm",   "#3B82F6"], // blue
  ["T1_mean_510", "5–10 mm",  "#228B5E"], // green
  ["T1_mean_1015","10–15 mm", "#8B5CF6"], // violet
];
const T1_COLS = ["T1_mean_05","T1_mean_510","T1_mean_1015","T1_mean_015"];

// Figure 2 panels: (title, OCT sector, x-axis label, OCT subtitle name)
const FIG2_PANELS = [
  ["Macula",     "All_1_3_gcc", "GCC thickness (µm)",  "GCC All (1–3 mm)"],
  ["Optic Disc", "All_um_",     "RNFL thickness (µm)", "RNFL Average"],
];

// averages shown in the box under the T1 profile (same fits as Figure 3)
const MAC_AVG  = [["All_1_3_gcc","GCC All (1–3 mm)"],["All_3_6_gcc","GCC All (3–6 mm)"],
                  ["All_field_gcc","GCC All Field"]];
const DISC_AVG = [["All_um_","RNFL Average"]];

// ---- Figure 3 metrics ----
const t1Var = "T1_mean_015";
const DISC_METRICS = ["TS_um_","ST_um_","SN_um_","NS_um_","NI_um_","IN_um_","IT_um_","TI_um_","All_um_"];
const MAC_METRICS  = ["Center_1_gcc","T_1_3_gcc","S_1_3_gcc","N_1_3_gcc","I_1_3_gcc","All_1_3_gcc",
                      "T_3_6_gcc","S_3_6_gcc","N_3_6_gcc","I_3_6_gcc","All_3_6_gcc","All_field_gcc"];
const NUMERIC_COLS = new Set([...T1_COLS, ...DISC_METRICS, ...MAC_METRICS]);

const DISC_NAMES = {
  TS_um_:"RNFL TS", ST_um_:"RNFL ST", SN_um_:"RNFL SN", NS_um_:"RNFL NS",
  NI_um_:"RNFL NI", IN_um_:"RNFL IN", IT_um_:"RNFL IT", TI_um_:"RNFL TI", All_um_:"RNFL Overall"
};
const MAC_NAMES = {
  Center_1_gcc:"GCC Center (1 mm)", N_1_3_gcc:"GCC N (1–3 mm)", S_1_3_gcc:"GCC S (1–3 mm)",
  T_1_3_gcc:"GCC T (1–3 mm)", I_1_3_gcc:"GCC I (1–3 mm)", N_3_6_gcc:"GCC N (3–6 mm)",
  S_3_6_gcc:"GCC S (3–6 mm)", T_3_6_gcc:"GCC T (3–6 mm)", I_3_6_gcc:"GCC I (3–6 mm)"
};
// full display-name lookup incl. the averages (used for Fig 2 titles/hover)
const ALL_NAMES = Object.assign({}, MAC_NAMES, DISC_NAMES, {
  All_1_3_gcc:"GCC All (1–3 mm)", All_3_6_gcc:"GCC All (3–6 mm)",
  All_field_gcc:"GCC All Field", All_um_:"RNFL Average"
});
const sectorName = m => ALL_NAMES[m] || m;

// default Fig 2 sectors, and the live selection (updated by clicking a Fig 3 wedge)
const DEF_MAC = FIG2_PANELS[0][1], DEF_DISC = FIG2_PANELS[1][1];
let selMac = DEF_MAC, selDisc = DEF_DISC;

/* ---- map geometry (notebook) ---- */
const LIM = 1.32, PI = Math.PI;
// Fig 3 scan underlays — loaded as data URIs at boot so they embed in the SVG
// export (an SVG rasterized via <img> cannot fetch external images).
let MAC_URI = "macula_OD.jpg", DISC_URI = "disc_OD.jpg";
function toDataURI(url){
  return fetch(url).then(r => r.blob()).then(b => new Promise((res, rej) => {
    const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej;
    fr.readAsDataURL(b);
  }));
}
const MAC_rC = 1.32/6.6, MAC_rI = 1.32*3/6.6, MAC_rO = 1.32*6/6.6;
const macLabels = ["N","S","T","I"];
const macAngles = [-1,1,3,5,7].map(k => k*PI/4);
// drawn macula wedges: centre disk, then inner(1-3)/outer(3-6) ring per quadrant
const MAC_SECTORS = [{metric:"Center_1_gcc", th1:0, th2:2*PI, ri:0, ro:MAC_rC}];
macLabels.forEach((q,k) => {
  MAC_SECTORS.push({metric:`${q}_1_3_gcc`, th1:macAngles[k], th2:macAngles[k+1], ri:MAC_rC, ro:MAC_rI});
  MAC_SECTORS.push({metric:`${q}_3_6_gcc`, th1:macAngles[k], th2:macAngles[k+1], ri:MAC_rI, ro:MAC_rO});
});
const DISC_ORDER = ["NS_um_","SN_um_","ST_um_","TS_um_","TI_um_","IT_um_","IN_um_","NI_um_"];
const DISC_SHORT = ["NS","SN","ST","TS","TI","IT","IN","NI"];
const DISC_THETA = [0,70,115,150,190,220,255,305,360].map(d => d*PI/180);
const DISC_rI = 0.5, DISC_rO = 1.05;
const DISC_SECTORS = DISC_ORDER.map((m,k) => ({metric:m, th1:DISC_THETA[k], th2:DISC_THETA[k+1], ri:DISC_rI, ro:DISC_rO}));

function isFullCircle(th1, th2, ri){ return ri===0 && Math.abs((th2-th1)-2*PI) < 1e-9; }
function wedgeXY(th1, th2, ri, ro, n=60){
  const th = [];
  for (let i=0;i<n;i++) th.push(th1 + (th2-th1)*i/(n-1));
  let x, y;
  if (isFullCircle(th1, th2, ri)) {            // full disk: perimeter only (no radial seam)
    x = th.map(t=>ro*Math.cos(t)); y = th.map(t=>ro*Math.sin(t));
  } else {                                      // annular wedge
    const thr = th.slice().reverse();
    x = [...th.map(t=>ri*Math.cos(t)), ...thr.map(t=>ro*Math.cos(t))];
    y = [...th.map(t=>ri*Math.sin(t)), ...thr.map(t=>ro*Math.sin(t))];
  }
  x.push(x[0]); y.push(y[0]);
  return {x, y};
}

/* ============================================================================
   STATISTICS — standard pooled OLS:  y ~ 1 + x   (t-test df=N-2, then BH-FDR)
   ========================================================================== */
function gammln(xx){
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,
           -1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let x=xx, y=xx, tmp=x+5.5; tmp-=(x+0.5)*Math.log(tmp);
  let ser=1.000000000190015;
  for (let j=0;j<6;j++){ y++; ser+=c[j]/y; }
  return -tmp+Math.log(2.5066282746310005*ser/x);
}
function betacf(a,b,x){
  const FPMIN=1e-30, MAXIT=200, EPS=3e-12;
  let qab=a+b, qap=a+1, qam=a-1, c=1, d=1-qab*x/qap;
  if (Math.abs(d)<FPMIN) d=FPMIN; d=1/d; let h=d;
  for (let m=1;m<=MAXIT;m++){
    const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if (Math.abs(d)<FPMIN) d=FPMIN;
    c=1+aa/c; if (Math.abs(c)<FPMIN) c=FPMIN;
    d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if (Math.abs(d)<FPMIN) d=FPMIN;
    c=1+aa/c; if (Math.abs(c)<FPMIN) c=FPMIN;
    d=1/d; const del=d*c; h*=del;
    if (Math.abs(del-1)<EPS) break;
  }
  return h;
}
function betai(a,b,x){
  if (x<=0) return 0; if (x>=1) return 1;
  const bt=Math.exp(gammln(a+b)-gammln(a)-gammln(b)+a*Math.log(x)+b*Math.log(1-x));
  return (x < (a+1)/(a+b+2)) ? bt*betacf(a,b,x)/a : 1-bt*betacf(b,a,1-x)/b;
}
// two-sided p of Student-t with df degrees of freedom
function tSf2(t, df){ return betai(df/2, 0.5, df/(df + t*t)); }

// Standard (pooled) OLS regression y ~ 1 + x — no subject random intercept.
// yMarg is kept equal to yRaw so the plotting code is unchanged; p is the
// ordinary t-test, fed through BH-FDR downstream so p_FDR is preserved.
function runOLS(rows, xCol, yCol){
  const pts=[];
  for (const r of rows){
    const x=r[xCol], y=r[yCol];
    if (x==null||y==null||isNaN(x)||isNaN(y)) continue;
    pts.push({x, y, g:r.MRI_ID, eye:r.Eye});
  }
  const n=pts.length; if (n<5) return null;
  const mx=pts.reduce((s,p)=>s+p.x,0)/n, my=pts.reduce((s,p)=>s+p.y,0)/n;
  let Sxx=0, Sxy=0;
  for (const p of pts){ Sxx+=(p.x-mx)**2; Sxy+=(p.x-mx)*(p.y-my); }
  if (Sxx<1e-10) return null;
  const beta1=Sxy/Sxx, beta0=my-beta1*mx;
  let SSR=0, SST=0, rss=0;
  const xVals=[], yMarg=[], yRaw=[], eye=[], subj=[];
  for (const p of pts){
    const yhat=beta0+beta1*p.x;
    rss+=(p.y-yhat)**2; SSR+=(yhat-my)**2; SST+=(p.y-my)**2;
    xVals.push(p.x); yMarg.push(p.y); yRaw.push(p.y); eye.push(p.eye); subj.push(p.g);
  }
  const sigma2=rss/(n-2);
  const se=Math.sqrt(sigma2/Sxx);
  const tstat=beta1/se;
  const pRaw=tSf2(Math.abs(tstat), n-2);
  const R2m = SST>0 ? SSR/SST : NaN;
  const Rm  = Math.sign(beta1)*Math.sqrt(Math.max(R2m,0));
  return {R2m, Rm, pRaw, pFdr:NaN, beta0, beta1, xVals, yMarg, yRaw, eye, subj};
}
// This dashboard is STANDARD-REGRESSION ONLY — always ordinary pooled OLS.
function fitModel(rows, xCol, yCol){
  return runOLS(rows, xCol, yCol);
}
function bhFDR(pArr){
  const out=pArr.map(()=>NaN), idx=[];
  pArr.forEach((p,i)=>{ if (p!=null && !isNaN(p)) idx.push(i); });
  const m=idx.length; if (m===0) return out;
  const ord=idx.slice().sort((a,b)=>pArr[a]-pArr[b]);
  let prev=1;
  for (let k=m-1;k>=0;k--){
    const i=ord[k];
    const adj=Math.min(prev, pArr[i]*m/(k+1));
    out[i]=adj; prev=adj;
  }
  return out;
}

/* ============================================================================
   COLOUR + FORMAT
   ========================================================================== */
function jet(t){
  t=Math.min(1,Math.max(0,t));
  const four=4*t;
  let r=Math.min(four-1.5,-four+4.5), g=Math.min(four-0.5,-four+3.5), b=Math.min(four+0.5,-four+2.5);
  r=Math.min(1,Math.max(0,r)); g=Math.min(1,Math.max(0,g)); b=Math.min(1,Math.max(0,b));
  return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
}
function jetRgba(val, vmin, vmax, alpha=0.5){
  if (val==null||isNaN(val)) return "rgba(153,153,153,0.5)";
  const frac=Math.min(1,Math.max(0,(val-vmin)/(vmax-vmin)));
  const [r,g,b]=jet(frac);
  return `rgba(${r},${g},${b},${alpha})`;
}
function fmtVal(v){ if (v==null||isNaN(v)) return ""; return v.toFixed(2).replace("0.","."); }
function fmtStat(v){ if (v==null||isNaN(v)) return "—"; return v.toFixed(2).replace(/^0\./,".").replace(/^-0\./,"-."); }
function pstr(p){ if (p==null||isNaN(p)) return "=NA"; return p<0.001 ? "<0.001" : "="+p.toFixed(3); }
const STAT_LBL  = k => (k==="R2m" ? "R²" : "R");
const STAT_TEX  = k => (k==="R2m" ? "R²" : "R");

/* ============================================================================

function buildFig1(rows){
  const mm = SLICE_COLS.map((_,i)=>i+0.5);

  for (const [eye,col] of [["OD",C_OD],["OS",C_OS]]){
    const M = rows.filter(r=>r.Eye===eye).map(r=>SLICE_COLS.map(c=>{
      const v=r[c]; return (v==null||v===""||isNaN(v))?null:v*T1_SCALE;
    }));
    if (!M.length) continue;
    const faint = col.replace("rgb","rgba").replace(")",",0.2)");
    for (const row of M){
      traces.push({x:mm, y:row, mode:"lines", line:{color:faint, width:0.8},
        hoverinfo:"skip", showlegend:false, connectgaps:false});
    }
    const mean=[], sd=[], keepX=[];
    for (let j=0;j<N_SLICES;j++){
      const vals=M.map(r=>r[j]).filter(v=>v!=null);
      const n=vals.length;
      if (n<MIN_N) continue;
      const mu=vals.reduce((s,v)=>s+v,0)/n;
      const va=vals.reduce((s,v)=>s+(v-mu)**2,0)/(n-1);
      keepX.push(mm[j]); mean.push(mu); sd.push(Math.sqrt(va));
    }

      hovertemplate:`mm %{x}<br>T₁ %{y:.0f} ms<extra>${isOD?"OD":"OS"}</extra>`
    });

  const axCommon = {color:"black", linecolor:"black", showline:true, mirror:false,

  const layout={

    margin:{l:px(0.9), r:px(0.1), t:px(0.6), b:px(0.6)},
    xaxis:{...axCommon, title:{text:"Position along ON (mm)", standoff:5}, range:[0,15]},

/* ============================================================================
   FIGURE 2 — correlation with 4 regression lines  (figsize 9.75 x 4.25, 2 panels)
   ========================================================================== */
function buildFig2Panel(divId, fname, rows, title, xlab, sector, defSector, statKey, visMap){
  const octName = sectorName(sector);
  const fits = T1_BANDS.map(([band]) => fitModel(rows, sector, band));
  const pfdr = bhFDR(fits.map(f=>f?f.pRaw:NaN));
  // standard OLS: plot raw ON T₁ (there is no marginal / random-effect correction)
  const useRaw = true;
  const yLab   = "T₁";
  const selBandLbl = (T1_BANDS.find(b=>b[0]===SEL_BAND) || [,""])[1];   // e.g. "0–15 mm"
  const traces=[];
  T1_BANDS.forEach(([band,lbl,col], i) => {
    const r=fits[i]; if (!r) return;
    const x=r.xVals, ym=(useRaw ? r.yRaw : r.yMarg), eye=r.eye, subj=r.subj, grp=band;
    // the SELECTED T₁ segment shows by default; other bands sit in the legend (click to show).
    // visMap (passed on the marginal↔raw toggle) restores the current legend state.
    const vis = (visMap && visMap[grp] !== undefined) ? visMap[grp]
              : (band===SEL_BAND ? true : "legendonly");
    // scatter: OD filled, OS open white-face — with per-point hover popup
    const od={x:[],y:[],s:[]}, os={x:[],y:[],s:[]};
    for (let j=0;j<x.length;j++){
      const g = eye[j]==="OD" ? od : os;
      g.x.push(x[j]); g.y.push(ym[j]); g.s.push(subj[j]);
    }
    const hov = side =>
      `<b>%{customdata}</b> · ${side} · ${lbl} <br>${octName} = %{x:.2f}` +
      `<br>${yLab} = %{y:.0f} ms<extra></extra>`;
    // OD/OS scatters share the band's legendgroup so a legend click toggles them too
    if (od.x.length) traces.push({x:od.x, y:od.y, customdata:od.s, mode:"markers",
      legendgroup:grp, showlegend:false, visible:vis,
      marker:{color:"white", size:10, line:{color:col, width:1.5}}, hovertemplate:hov("OD"), hoverlabel:{bgcolor:"#222", font:{color:"#fff"}}});
    if (os.x.length) traces.push({x:os.x, y:os.y, customdata:os.s, mode:"markers",
      legendgroup:grp, showlegend:false, visible:vis,
      marker:{color:col, size:10, line:{width:0}}, hovertemplate:hov("OS"), hoverlabel:{bgcolor:"#222", font:{color:"#fff"}}});
    // regression line (legend carries the stat + p_FDR)
    const xmin=Math.min(...x), xmax=Math.max(...x), xl=[], yl=[];
    for (let k=0;k<=100;k++){ const xx=xmin+(xmax-xmin)*k/100; xl.push(xx); yl.push(r.beta0+r.beta1*xx); }
    const stat = statKey==="R2m" ? r.R2m : r.Rm;
    const slbl = STAT_LBL(statKey);
    const star = (pfdr[i]!=null && !isNaN(pfdr[i]) && pfdr[i]<0.05) ? " *" : "";
    traces.push({x:xl, y:yl, mode:"lines", line:{color:col, width:2}, legendgroup:grp, visible:vis,
      name:`${lbl}  (${slbl}=${fmtStat(stat)})${star}`,
      hoverinfo:"skip", showlegend:true});
  });
  // keep the DEFAULT sector visible as a grey dashed reference (selected T₁ segment)
  // when a different sector has been selected from Figure 3
  if (sector !== defSector){
    const rd = fitModel(rows, defSector, SEL_BAND);
    if (rd){
      const xmin=Math.min(...rd.xVals), xmax=Math.max(...rd.xVals), xl=[], yl=[];
      for (let k=0;k<=100;k++){ const xx=xmin+(xmax-xmin)*k/100; xl.push(xx); yl.push(rd.beta0+rd.beta1*xx); }
      traces.push({x:xl, y:yl, mode:"lines", line:{color:"#999", width:1.5, dash:"dot"},
        name:`${selBandLbl} ${sectorName(defSector)}`, hoverinfo:"skip", showlegend:true});
    }
  }
  const axCommon={color:"black", linecolor:"black", showline:true, mirror:false,
    showgrid:false, zeroline:false, ticks:"outside", tickcolor:"black", fixedrange:true};
  const layout={
    width:px(4.25), height:FIG23_H, paper_bgcolor:"white", plot_bgcolor:"white", dragmode:false,
    font:{color:"black", family:"DejaVu Sans, Arial, sans-serif", size:pt(12)},
    title:{text:`${title} – ${octName}`, font:{size:pt(14)}, x:0.5, xanchor:"center"},
    margin:{l:px(0.85), r:px(0.1), t:px(0.6), b:px(0.6)},
    xaxis:{...axCommon, title:{text:xlab, standoff:5}},
    // marginal T1 keeps the fixed window; raw T1 auto-ranges (subject offsets widen the spread)
    yaxis:{...axCommon, title:{text:`${useRaw?"":"marginal "}ON T₁ (ms)`},
      ...(useRaw ? {autorange:true} : {range:[650,1550]})},
    legend:{x:1, y:1, xanchor:"right", yanchor:"top", groupclick:"togglegroup",
      bgcolor:"rgba(255,255,255,0.7)", bordercolor:"#ccc", borderwidth:1, font:{size:pt(9)},
      tracegroupgap:1},
    showlegend:true
  };
  Plotly.react(divId, traces, layout, figCfg(divId, fname, px(4.25), FIG23_H, saveFig2Combined));
}

function fitMetrics(rows, metrics, band=t1Var){
  const res={};
  for (const m of metrics) res[m]=fitModel(rows, m, band);
  const ps=metrics.map(m=>res[m]?res[m].pRaw:NaN);
  bhFDR(ps).forEach((v,i)=>{ if (res[metrics[i]]) res[metrics[i]].pFdr=v; });
  return res;
}
// averages box under the T1 profile — same fits/FDR as Figure 3.
// Rows are clickable: click an average → the matching Fig 2 panel uses it.
function buildAvgBox(statKey, rows){
  const slbl = STAT_LBL(statKey);
  // fit each average metric against all 4 T1 bands; FDR per band within its family
  const perBand = {};
  T1_BANDS.forEach(([bk]) => {
    perBand[bk] = { mac:  fitMetrics(rows, MAC_METRICS,  bk),
                    disc: fitMetrics(rows, DISC_METRICS, bk) };
  });
  // keep the leading zero in this table only (e.g. 0.84, not .84)
  const fmtCell = v => (v==null||isNaN(v)) ? "—" : v.toFixed(2);
  // one <tr>; regionCell (rowspan) only on the first row of each region group
  const metricRow = (key,name,region,selected,regionCell) => {
    const cells = T1_BANDS.map(([bk]) => {
      const r = perBand[bk][region][key];
      const val = r ? (statKey==="R2m"?r.R2m:r.Rm) : NaN;
      const sig = !!(r && !isNaN(r.pFdr) && r.pFdr<0.05);
      return `<td class="aval${sig?" sig":""}">${fmtCell(val)}${sig?"*":""}</td>`;
    }).join("");
    return `<tr class="avgrow${key===selected?" sel":""}" data-metric="${key}" data-region="${region}">`+
           regionCell+`<td class="anm">${name}</td>${cells}</tr>`;
  };
  const groupRows = (label, list, region, selected) =>
    list.map(([k,n],i) => metricRow(k,n,region,selected,
      i===0 ? `<td class="region" rowspan="${list.length}">${label}</td>` : "")).join("");
  const avgEl = document.getElementById("avgbox");
  avgEl.innerHTML =
    `<div class="avgtitle">OCT × T₁ band correlation &nbsp;·&nbsp; ${slbl}`+
      `<span class="avghint">— click a row to use that sector in Figure 2</span></div>`+
    `<table class="avgtbl"><thead><tr>`+
      `<th class="corner" colspan="2">T₁ sector</th>`+
      T1_BANDS.map(([,lbl])=>`<th>${lbl}</th>`).join("")+`</tr></thead><tbody>`+
      groupRows("Macula<br>(GCC)", MAC_AVG, "mac", selMac)+
      groupRows("Optic Disc<br>(RNFL)", DISC_AVG, "disc", selDisc)+
    `</tbody></table>`;
  document.querySelectorAll("#avgbox .avgrow").forEach(el => {
    el.addEventListener("click", () => {
      const m = el.dataset.metric;
      if (el.dataset.region === "mac")  selMac  = (selMac  === m) ? DEF_MAC  : m;
      else                              selDisc = (selDisc === m) ? DEF_DISC : m;
      buildFig2(activeMerged(), STAT);
      buildAvgBox(STAT, rows);              // refresh the highlight
      requestAnimationFrame(refitAll);
    });
  });
}

// Save Fig 3 with ROUNDED stat boxes: Plotly's PNG export re-plots from scratch
// (dropping the on-screen rx/ry), so instead export SVG, inject rx/ry onto the
// annotation rects, then rasterize that SVG to a 600-DPI PNG ourselves.
function saveFig3(gd){
  const scale = 600/96, w = px(8.5), h = FIG23_H;
  Plotly.toImage(gd, {format:"svg", width:w, height:h}).then(uri => {
    const svg = decodeURIComponent(uri.replace(/^data:image\/svg\+xml,/, ""));
    const doc = new DOMParser().parseFromString(svg, "image/svg+xml");
    doc.querySelectorAll("g.annotation rect").forEach(r => {
      r.setAttribute("rx", 6); r.setAttribute("ry", 6);
    });
    const root = doc.documentElement;
    if (!root.getAttribute("viewBox")) root.setAttribute("viewBox", `0 0 ${w} ${h}`);
    root.setAttribute("width",  w*scale);
    root.setAttribute("height", h*scale);
    const out = new XMLSerializer().serializeToString(root);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(w*scale); canvas.height = Math.round(h*scale);
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "fig03_OCT_maps.png";
      a.click();
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(out);
  });
}

// Click a Fig 3 wedge → drive the matching Fig 2 panel with that sector.
// Clicking the already-selected sector reverts that panel to its default.
function onFig3Click(ev){
  if (!ev.points || !ev.points.length) return;
  const pt = ev.points[0];
  const m  = (pt.data && pt.data.meta) || (pt.fullData && pt.fullData.meta);
  if (!m) return;
  if (m.endsWith("_gcc"))      selMac  = (selMac  === m) ? DEF_MAC  : m;
  else if (m.endsWith("_um_")) selDisc = (selDisc === m) ? DEF_DISC : m;
  else return;
  const merged = activeMerged();
  buildFig2(merged, STAT);
  buildAvgBox(STAT, merged);            // clear the highlight on the previously-selected average
  requestAnimationFrame(refitAll);
}

  buildFig2(merged, STAT);
  buildFig3(merged, STAT, discRes, macRes);
  buildAvgBox(STAT, merged);
  requestAnimationFrame(refitAll);
}

// Every figure is built at its NATIVE size (exactly what the save button exports).
// In the dashboard each figure is uniformly CSS-scaled to fit its cell, leaving
// blank space in the non-limiting dimension. Maximise does the same into the
// overlay. So the ONLY transform is a uniform zoom — no font/size/legend changes.
function refitAll(){ if (maximized) sizeOverlayFigure(); else fitFigures(); }

// scale each dashboard figure to fit its panel (letterboxed, ratio preserved)
function fitFigures(){
  document.querySelectorAll(".figpanel.figfig").forEach(panel => {
    const content = panel.querySelector(".figcontent");
    if (!content) return;                              // (skipped while maximised)
    content.style.transform = "none";
    const natW = content.offsetWidth, natH = content.offsetHeight;
    if (!natW || !natH) return;
    const cs = getComputedStyle(panel);
    const availW = panel.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = panel.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
    const s = Math.min(availW / natW, availH / natH);
    content.style.transformOrigin = "center center";
    content.style.transform = "scale(" + s + ")";
  });
}

// ---- per-figure expand: move the native figure into the overlay and zoom it ----
let maximized = null;   // { content, ph }
function maximizeFigure(panel){
  if (maximized) closeOverlay();
  const content = panel.querySelector(".figcontent");
  const ph = document.createComment("figcontent-placeholder");
  content.parentNode.insertBefore(ph, content);        // remember where it came from
  content.style.transform = "none";
  document.getElementById("ovstage").appendChild(content);
  document.getElementById("figoverlay").classList.add("on");
  maximized = { content, ph };
  requestAnimationFrame(sizeOverlayFigure);
}
function sizeOverlayFigure(){
  if (!maximized) return;
  const ov = document.getElementById("figoverlay");
  const c  = maximized.content;
  c.style.transform = "none";
  const natW = c.offsetWidth, natH = c.offsetHeight;
  if (!natW || !natH) return;
  const PAD = 24;
  const s = Math.min((ov.clientWidth - 2*PAD) / natW, (ov.clientHeight - 2*PAD) / natH);
  c.style.transformOrigin = "center center";
  c.style.transform = "scale(" + s + ")";
}
function closeOverlay(){
  if (!maximized) return;
  const { content, ph } = maximized;
  content.style.transform = "none";
  ph.parentNode.replaceChild(content, ph);
  document.getElementById("figoverlay").classList.remove("on");
  maximized = null;
  requestAnimationFrame(fitFigures);
}

function parseCSV(text, numericSet){
  const lines=text.trim().split(/\r?\n/);
  const header=lines[0].split(",");
  const rows=[];
  for (let i=1;i<lines.length;i++){
    const cells=lines[i].split(",");
    const o={};
    header.forEach((h,j)=>{
      const c=cells[j];
      o[h] = numericSet.has(h) ? ((c==null||c==="")?null:parseFloat(c)) : c;
    });
    // T1 stored in seconds -> ms (so marginal-T1 axis matches the notebook)
    for (const k of T1_COLS) if (o[k]!=null && !isNaN(o[k])) o[k]*=T1_SCALE;
    rows.push(o);
  }
  return rows;
}

function buildSidebar(){
  const list=document.getElementById("subjlist");
  list.innerHTML="";
  SUBJECTS.forEach(s => {
    const checked = !excluded.has(s);
    const row=document.createElement("div");
    row.className="subjrow"+(checked?"":" excluded");
    row.innerHTML=`<label><input type="checkbox" data-subj="${s}" ${checked?"checked":""}> ${s}</label>`;
    list.appendChild(row);
    row.querySelector("input").addEventListener("change", e=>{
      if (e.target.checked) excluded.delete(s); else excluded.add(s);
      row.classList.toggle("excluded", !e.target.checked);
      updateCount(); renderAll();
    });
  });
  updateCount();
}
function updateCount(){
  const n=SUBJECTS.length-excluded.size;
  document.getElementById("ncount").textContent=`${n} / ${SUBJECTS.length} subjects included`;
}
function setAll(checked){
  document.querySelectorAll('#subjlist input').forEach(inp=>{
    inp.checked=checked;
    const s=inp.dataset.subj;
    if (checked) excluded.delete(s); else excluded.add(s);
    inp.closest(".subjrow").classList.toggle("excluded", !checked);
  });
  updateCount(); renderAll();
}

function showError(msg){
  document.getElementById("err").style.display="block";
  document.getElementById("err").innerHTML=msg;
}

async function boot(){
  let mTxt, pTxt;
  try {
    // cache-buster + no-store so edited CSVs always load fresh (no stale disk cache)
    const bust = "?v=" + Date.now();
    const noStore = { cache: "no-store" };
    const [mr,pr]=await Promise.all([
      fetch("data_merged.csv"  + bust, noStore),
      fetch("data_profile.csv" + bust, noStore)
    ]);
    if (!mr.ok) throw new Error("data_merged.csv HTTP "+mr.status);
    if (!pr.ok) throw new Error("data_profile.csv HTTP "+pr.status);
    mTxt=await mr.text(); pTxt=await pr.text();
  } catch(e){
    showError(
      "Could not load the data files.<br><br>"+
      "This page must be served over HTTP.<br>"+
      "To preview locally, run <code>python -m http.server</code> in this folder and open "+
      "<code>http://localhost:8000</code>.<br><br>Details: "+e.message);
    return;
  }
  ALL_ROWS     = parseCSV(mTxt, NUMERIC_COLS);
  PROFILE_ROWS = parseCSV(pTxt, new Set(SLICE_COLS));
  SUBJECTS = [...new Set(ALL_ROWS.map(r=>r.MRI_ID))].sort();
  EXCLUDE_DEFAULT.forEach(s=>{ if (SUBJECTS.includes(s)) excluded.add(s); });

  // embed the Fig 3 underlays (best-effort; falls back to the file paths)
  try { [MAC_URI, DISC_URI] = await Promise.all([toDataURI("macula_OD.jpg"), toDataURI("disc_OD.jpg")]); }
  catch(e){ /* keep file-path sources */ }

  document.getElementById("app").style.display="flex";
  buildSidebar();
  document.getElementById("selAll").addEventListener("click", ()=>setAll(true));
  document.getElementById("selNone").addEventListener("click", ()=>setAll(false));
  document.querySelectorAll('input[name="stat"]').forEach(radio=>{
    radio.addEventListener("change", ()=>{ if (radio.checked){ STAT=radio.value; renderAll(); } });
  });
  // T₁-sector dropdown → drives the highlighted band in Fig 2 and the sector plot (Fig 3)
  const t1sel = document.getElementById("t1band");
  t1sel.value = SEL_BAND;
  t1sel.addEventListener("change", ()=>{
    SEL_BAND = t1sel.value;
    renderAll();                 // rebuild Fig 2 (highlight) + Fig 3 (wedges use the chosen band)
  });
  const refit = () => refitAll();
  window.addEventListener("resize", refit);
  // Observe the stage: refit whenever the available area changes for ANY reason
  // (window shrink, browser zoom, devtools docking), not just resize events.
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => requestAnimationFrame(refit));
    ro.observe(document.getElementById("stage"));
  }
  document.querySelectorAll(".maxbtn").forEach(b =>
    b.addEventListener("click", () => maximizeFigure(b.closest(".figpanel"))));
  document.getElementById("ovclose").addEventListener("click", closeOverlay);
  document.getElementById("figoverlay").addEventListener("click", e => {
    if (e.target.id === "figoverlay") closeOverlay();   // click backdrop to exit
  });
  window.addEventListener("keydown", e => { if (e.key === "Escape") closeOverlay(); });
  renderAll();
}
boot();
</script>
